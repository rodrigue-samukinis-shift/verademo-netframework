name: Snyk Security Scan

on: [push, pull_request]

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: |
            npm install
            npm install -g snyk
      - run: |
            snyk auth ${{ secrets.SNYK_TOKEN }}
            snyk test
        shell: bash
